name: V29 Cargo Order Regression
on:
  push:
    branches: [v29-old-ui]
    paths:
      - 'app.py'
      - 'cargo_order.py'
      - 'cargo_order_ui.py'
      - 'tests/test_cargo_order.py'
      - '.github/workflows/cargo-order-regression.yml'
  pull_request:
    branches: [v29-old-ui]
jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pytest
      - run: python -m py_compile app.py cargo_order.py cargo_order_ui.py
      - run: PYTHONPATH=. python -m pytest tests/test_cargo_order.py -q
