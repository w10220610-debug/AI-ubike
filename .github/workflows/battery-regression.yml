name: V29 Battery Script Regression
on:
  push:
    branches: [v29-old-ui]
    paths:
      - 'battery_upgrade.py'
      - 'app.py'
      - 'tests/battery_browser_syntax.cjs'
      - 'tests/inline_battery_behavior.cjs'
      - '.github/workflows/battery-regression.yml'
  pull_request:
    branches: [v29-old-ui]
jobs:
  battery-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/battery_browser_syntax.cjs
      - run: node tests/inline_battery_behavior.cjs
      - run: python -m py_compile app.py battery_upgrade.py
